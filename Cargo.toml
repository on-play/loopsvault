[workspace]
resolver = "2"
members = [
    "crates/loopsvault-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/on-play/loopsvault"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"

[profile.release]
# A secrets daemon should not carry symbol names or panic strings any further
# than it has to.
strip = "symbols"
panic = "abort"
lto = true
